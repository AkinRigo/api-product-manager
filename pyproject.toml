[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "product-manager-api"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic",
    "pytest",
    "python-dotenv",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]